<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>睡眠音量レコーダー</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; margin: 16px; background: #f7f9fa; color: #333; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
    #startBtn { background: #007aff; color: white; }
    #stopBtn { background: #ff3b30; color: white; display: none; }
    #status { margin: 12px 0; font-size: 14px; color: #666; }
    #chart-container { position: relative; width: 100%; height: 320px; margin-top: 20px; display: none; }
    audio { width: 100%; margin-top: 16px; display: none; }
    #overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: black; color: #888; z-index: 9999; text-align: center; padding-top: 40vh;
    }
  </style>
</head>
<body>

  <h2>睡眠音量レコーダー</h2>
  <div id="status">マイクを許可して開始してください</div>
  <button id="startBtn">録音開始</button>
  <button id="stopBtn">録音停止・グラフ表示</button>

  <div id="overlay">
    <p style="color:#aaa;">録音中（スリープ防止中）</p>
    <p style="font-size: 12px; color:#666;">画面タップで停止画面に戻ります</p>
  </div>

  <audio id="player" controls playsinline></audio>
  <div id="chart-container">
    <canvas id="volChart"></canvas>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];
    let audioContext, analyser, dataArray;
    let volumeHistory = [];
    let recordTimer = null;
    let animId = null;
    let currentPeak = 0;
    let wakeLock = null;
    let chartInstance = null;

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusText = document.getElementById('status');
    const player = document.getElementById('player');
    const overlay = document.getElementById('overlay');
    const chartContainer = document.getElementById('chart-container');

    overlay.onclick = () => { overlay.style.display = 'none'; };

    startBtn.onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
        });

        if ('wakeLock' in navigator) {
          try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){}
        }

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        const source = audioContext.createMediaStreamSource(stream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);

        const mime = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        audioChunks = [];
        volumeHistory = [];
        currentPeak = 0;

        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.start(5000);

        // 常時音量を監視（0〜100の直感的なスコアに換算）
        function trackVolume() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) {
            sum += dataArray[i];
          }
          const avg = sum / dataArray.length;
          // 0〜255の入力を 0〜100 の音量レベルに換算
          const level = Math.min(100, Math.round((avg / 128) * 100));
          if (level > currentPeak) {
            currentPeak = level;
          }
          animId = requestAnimationFrame(trackVolume);
        }
        trackVolume();

        // 1秒ごとの最大ピークを記録
        recordTimer = setInterval(() => {
          volumeHistory.push(currentPeak);
          currentPeak = 0;
        }, 1000);

        startBtn.style.display = 'none';
        stopBtn.style.display = 'inline-block';
        overlay.style.display = 'block';
        statusText.textContent = '録音中...';

      } catch (err) {
        alert('エラー: ' + err.message);
      }
    };

    stopBtn.onclick = () => {
      clearInterval(recordTimer);
      if (animId) cancelAnimationFrame(animId);
      mediaRecorder.stop();
      if (wakeLock) wakeLock.release();

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
        player.src = URL.createObjectURL(audioBlob);
        player.style.display = 'block';
        chartContainer.style.display = 'block';
        statusText.textContent = 'グラフの山をタップすると該当秒数にジャンプして再生します。';

        stopBtn.style.display = 'none';
        startBtn.style.display = 'inline-block';
        renderChart();
      };
    };

    function renderChart() {
      const ctx = document.getElementById('volChart').getContext('2d');
      const labels = volumeHistory.map((_, i) => {
        const m = String(Math.floor(i / 60)).padStart(2, '0');
        const s = String(i % 60).padStart(2, '0');
        return `${m}:${s}`;
      });

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '音量レベル',
            data: volumeHistory,
            borderColor: '#007aff',
            backgroundColor: 'rgba(0, 122, 255, 0.25)',
            borderWidth: 2,
            fill: 'start', // 下（0）から山に向かって塗りつぶす
            tension: 0.2,
            pointRadius: 3,
            pointHitRadius: 15
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { 
              min: 0, 
              max: 100, 
              title: { display: true, text: '音の大きさ (0〜100)' } 
            }
          },
          onClick: (evt, activeElements) => {
            if (activeElements.length > 0) {
              const index = activeElements[0].index;
              player.currentTime = index;
              player.play();
            }
          }
        }
      });
    }
  </script>
</body>
</html>
